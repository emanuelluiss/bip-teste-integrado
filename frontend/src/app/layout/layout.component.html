<div class="app-shell" [class.collapsed]="sidebarCollapsed">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
        <polygon points="14,7 21,11 21,19 14,23 7,19 7,11" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="1"/>
        <circle cx="14" cy="15" r="3" fill="#00e5ff"/>
      </svg>
      <span class="logo-text" *ngIf="!sidebarCollapsed">FinanceApp</span>
    </div>

    <nav class="sidebar-nav">
      <button
        *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="isActive(item.route)"
        (click)="navigate(item.route)"
        pRipple>
        <i [class]="item.icon"></i>
        <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !sidebarCollapsed">{{ item.badge }}</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <div class="user-info" *ngIf="!sidebarCollapsed">
        <div class="user-avatar">{{ initials }}</div>
        <div class="user-details">
          <span class="user-name">{{ username }}</span>
          <span class="user-role">Administrador</span>
        </div>
      </div>
      <button class="logout-btn" (click)="auth.logout()" pRipple>
        <i class="pi pi-sign-out"></i>
        <span *ngIf="!sidebarCollapsed">Sair</span>
      </button>
    </div>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <div class="main-area">
    <header class="topbar">
      <p-button
        icon="pi pi-bars"
        [text]="true"
        severity="secondary"
        styleClass="hamburger-btn"
        (onClick)="sidebarCollapsed = !sidebarCollapsed">
      </p-button>
      <span class="breadcrumb">{{ breadcrumb }}</span>
      <div class="topbar-right">
        <button class="icon-btn" pRipple>
          <i class="pi pi-bell"></i>
        </button>
        <div class="topbar-user">
          <div class="user-avatar-sm">{{ initials }}</div>
          <span>{{ username }}</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
