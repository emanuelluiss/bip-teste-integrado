<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="page-header">
  <div>
    <h2 class="page-title">Benefícios</h2>
    <p class="page-subtitle">Gerencie todos os benefícios cadastrados</p>
  </div>
  <p-button label="Novo Benefício" icon="pi pi-plus" (onClick)="openNew()"></p-button>
</div>

<!-- Toolbar de filtro -->
<p-toolbar styleClass="mb-4">
  <ng-template pTemplate="start">
    <span class="filter-wrapper">
      <i class="pi pi-search filter-icon"></i>
      <input
        type="text"
        pInputText
        placeholder="Buscar por nome ou descrição..."
        class="filter-input"
        (input)="applyFilter($event)" />
    </span>
  </ng-template>
  <ng-template pTemplate="end">
    <span class="record-count">{{ filteredBeneficios.length }} registro(s)</span>
  </ng-template>
</p-toolbar>

<!-- Tabela -->
<div class="table-card">
  <p-table
    [value]="filteredBeneficios"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [sortMode]="'multiple'"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="nome">Nome <p-sortIcon field="nome"></p-sortIcon></th>
        <th pSortableColumn="descricao">Descrição <p-sortIcon field="descricao"></p-sortIcon></th>
        <th pSortableColumn="valor" style="min-width:140px">Valor <p-sortIcon field="valor"></p-sortIcon></th>
        <th pSortableColumn="ativo" style="width:110px">Status <p-sortIcon field="ativo"></p-sortIcon></th>
        <th style="width:130px">Ações</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="loadingbody">
      <tr *ngFor="let i of [1,2,3,4,5]">
        <td><p-skeleton height="1.2rem" width="60%"></p-skeleton></td>
        <td><p-skeleton height="1.2rem" width="80%"></p-skeleton></td>
        <td><p-skeleton height="1.2rem" width="50%"></p-skeleton></td>
        <td><p-skeleton height="1.2rem" width="60px"></p-skeleton></td>
        <td><p-skeleton height="1.2rem" width="80px"></p-skeleton></td>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-b>
      <tr>
        <td><strong>{{ b.nome }}</strong></td>
        <td class="text-secondary">{{ b.descricao || '—' }}</td>
        <td>
          <app-money-display [value]="b.valor" class="mono"></app-money-display>
        </td>
        <td><app-status-badge [ativo]="b.ativo"></app-status-badge></td>
        <td>
          <div class="action-btns">
            <p-button
              icon="pi pi-eye"
              size="small"
              [text]="true"
              pTooltip="Ver detalhes"
              tooltipPosition="top"
              (onClick)="verDetalhe(b.id)">
            </p-button>
            <p-button
              icon="pi pi-pencil"
              size="small"
              [text]="true"
              pTooltip="Editar"
              tooltipPosition="top"
              (onClick)="openEdit(b)">
            </p-button>
            <p-button
              icon="pi pi-trash"
              size="small"
              [text]="true"
              severity="danger"
              pTooltip="Excluir"
              tooltipPosition="top"
              (onClick)="confirmDelete(b)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="empty-message">
          <i class="pi pi-inbox"></i>
          <span>Nenhum benefício encontrado.</span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Dialog criar/editar -->
<p-dialog
  [(visible)]="dialogVisible"
  [header]="dialogTitle"
  [modal]="true"
  [style]="{width: '500px'}"
  [breakpoints]="{'768px': '95vw'}"
  [draggable]="false">

  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="dialog-fields">

      <div class="field">
        <label for="d-nome">Nome *</label>
        <input id="d-nome" type="text" pInputText formControlName="nome" placeholder="Nome do benefício" class="w-full"
               [class.ng-invalid]="nome.invalid && nome.touched" />
        <small class="error-msg" *ngIf="nome.invalid && nome.touched">Nome obrigatório (máx. 100 chars).</small>
      </div>

      <div class="field">
        <label for="d-descricao">Descrição</label>
        <input id="d-descricao" type="text" pInputText formControlName="descricao" placeholder="Descrição opcional" class="w-full" />
      </div>

      <div class="field">
        <label for="d-valor">Valor *</label>
        <p-inputnumber
          inputId="d-valor"
          formControlName="valor"
          mode="currency"
          currency="BRL"
          locale="pt-BR"
          placeholder="R$ 0,00"
          styleClass="w-full"
          [class.ng-invalid]="valor.invalid && valor.touched">
        </p-inputnumber>
        <small class="error-msg" *ngIf="valor.invalid && valor.touched">Valor obrigatório e deve ser > 0.</small>
      </div>

      <div class="field-inline">
        <p-checkbox formControlName="ativo" [binary]="true" inputId="d-ativo"></p-checkbox>
        <label for="d-ativo">Benefício ativo</label>
      </div>

    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" [text]="true" severity="secondary" (onClick)="dialogVisible = false"></p-button>
    <p-button [label]="editingId ? 'Salvar' : 'Criar'" icon="pi pi-check" (onClick)="save()"></p-button>
  </ng-template>
</p-dialog>
